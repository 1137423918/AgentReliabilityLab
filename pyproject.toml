[project]
name = "agent-reliability-lab"
version = "0.2.0"
description = "Versioned tool contracts and recoverable maintenance-agent workflows"
requires-python = ">=3.11"
dependencies = ["deepagents==0.7.41", "langgraph-checkpoint-sqlite==3.1.3"]

[project.optional-dependencies]
local-model = ["langchain-openai>=1.8.5,<2"]

[project.scripts]
agent-lab-worker = "agent_lab.worker:main"
agent-lab-inspect = "agent_lab.inspect_run:main"
agent-lab-review = "agent_lab.review_workbench:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["audit", "compare", "prepare"]

[tool.setuptools.packages.find]
include = ["agent_lab*"]
