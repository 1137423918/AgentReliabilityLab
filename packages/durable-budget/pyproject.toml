[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab-durable-budget"
version = "0.1.0"
description = "Conservative durable request reservations for asyncio loopback agents"
requires-python = ">=3.11"
dependencies = ["httpx2>=2.16.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
