[project]
name = "agentlab-research-assistant-runtime"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "llama-index-core==0.14.26", "torch==2.6.0", "transformers==4.57.6",
  "numpy==2.2.6", "mcp==2.3.0", "httpx2==2.16.2", "pypdf==7.1.1", "langgraph==1.2.24", "langgraph-checkpoint-sqlite==3.1.3"
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
