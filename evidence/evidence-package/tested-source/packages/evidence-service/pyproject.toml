[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab-evidence"
version = "0.1.0"
description = "Pinned JSON report evidence through bounded loopback MCP audits"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx2==2.16.2"]

[project.scripts]
agentlab-evidence = "agentlab_evidence.evidence_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
